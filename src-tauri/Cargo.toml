[package]
name = "calculatrice"
version = "0.1.0"
description = "Calculatrice simple et scientifique, en français"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
moteur = { path = "moteur" }

[workspace]
members = ["moteur"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
