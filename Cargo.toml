[package]
name = "calculatrice"
version = "0.2.0"
description = "Calculette native standard et scientifique"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace]
members = ["moteur"]

[dependencies]
moteur = { path = "moteur" }
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
sys-locale = "0.3"

[build-dependencies]
slint-build = "~1.18.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
